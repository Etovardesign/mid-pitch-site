<title>MiD · Private pitch</title>
<style id="gate-style">

  input { flex: 1; min-width: 0; background: var(--ink2); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; color: var(--bone);

  input:hover { border-color: var(--mute); }
  button { border: 1px solid var(--bone); border-radius: 4px; padding: 0 20px; background: var(--bone); color: var(--ink); font: 600 16px "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
  .msg { margin-top: 12px; min-height: 22px; font-size: 15px; color: var(--mute); }
  .msg.err { color: var(--red); }
  footer { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 13px; color: var(--mute); }
</style>

    <p class="sub">This pitch is encrypted. Enter the access code you were sent to open it.</p>
    <form id="f" autocomplete="off" novalidate>
      <label for="code">Access code</label>
      <div class="row">
        <input id="code" name="code" aria-describedby="msg" spellcheck="false" autocapitalize="characters" required />
        <button id="go" type="submit">Open</button>

      <p id="msg" class="msg" role="status" aria-live="polite"></p>

<footer>MiD · Indianapolis, IN</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const norm = (c) => c.trim().toUpperCase()
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  let payloadP = null
  const getPayload = () => (payloadP ??= fetch('./payload.json', { cache: 'no-store' }).then((r) => r.json()))

  async function decrypt(code) {
    const p = await getPayload()
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey'])
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, key, unb64(p.ct))
    return JSON.parse(new TextDecoder().decode(pt))
  }

  function mount({ js, css }) {
    // drop the gate's own unlayered CSS first, or it would override the deck's layered Tailwind styles
    document.getElementById('gate-style').remove()
    const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style)
    document.querySelector('main').remove(); document.querySelector('footer').remove()
    const root = document.createElement('div'); root.id = 'root'; document.body.appendChild(root)
    document.title = 'MiD · Transmissions'
    const s = document.createElement('script'); s.type = 'module'
    s.src = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }))
    document.body.appendChild(s)
  }

  async function attempt(code, silent) {
    $('go').disabled = true
    if (!silent) { $('msg').className = 'msg'; $('msg').textContent = 'Opening…' }
    try {
      const deck = await decrypt(code)
      try { sessionStorage.setItem('mid-code', code) } catch (e) {}
      mount(deck)
    } catch (e) {
      try { sessionStorage.removeItem('mid-code') } catch (e2) {}
      $('go').disabled = false
      if (silent) return
      $('msg').className = 'msg err'
      $('msg').textContent = 'That code didn’t work. Check it and try again.'
      $('code').setAttribute('aria-invalid', 'true'); $('code').focus()
    }
  }

  $('f').addEventListener('submit', (e) => {
    e.preventDefault()
    const c = norm($('code').value)
    if (!c) { $('msg').className = 'msg err'; $('msg').textContent = 'Enter your access code.'; $('code').focus(); return }
    attempt(c, false)
  })
  let saved = null
  try { saved = sessionStorage.getItem('mid-code') } catch (e) {}
  if (saved) attempt(saved, true)
})()
</script>
